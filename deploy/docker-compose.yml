version: "3.9"

services:
  caddy:
    image: caddy:2-alpine
    container_name: selfmx-caddy
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
      - "${HTTPS_PORT:-443}:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - selfmx-net
    depends_on:
      selfmx:
        condition: service_healthy
    environment:
      - SELFMX_DOMAIN=${SELFMX_DOMAIN}
      - SELFMX_EMAIL=${SELFMX_EMAIL}
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  postgres:
    image: postgres:17
    container_name: selfmx-postgres
    restart: unless-stopped
    environment:
      - POSTGRES_USER=selfmx
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=selfmx
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - selfmx-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U selfmx -d selfmx"]
      interval: 10s
      timeout: 5s
      start_period: 15s
      retries: 10
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  selfmx:
    image: ghcr.io/aduggleby/selfmx:${SELFMX_VERSION:-latest}
    container_name: selfmx-app
    restart: unless-stopped
    expose:
      - "17400"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - selfmx-net
    environment:
      # Database (PostgreSQL is the default; Hangfire and audit tables live in the same database)
      - ConnectionStrings__DefaultConnection=Host=postgres;Port=5432;Database=selfmx;Username=selfmx;Password=${POSTGRES_PASSWORD}
      - Database__Provider=Postgres
      # To use SQL Server instead, remove the postgres service and use:
      # - ConnectionStrings__DefaultConnection=Server=your-sql-host,1433;Database=SelfMX;User Id=selfmx;Password=...;TrustServerCertificate=True
      # - Database__Provider=SqlServer
      # Admin authentication (SHA-512 crypt hash for browser UI login)
      - App__AdminPasswordHash=${SELFMX_ADMIN_PASSWORD_HASH}
      - App__SessionExpirationDays=30
      # Rate limiting
      - App__MaxLoginAttemptsPerMinute=5
      - App__MaxApiRequestsPerMinute=100
      - App__VerificationTimeout=72:00:00
      - App__VerificationPollInterval=00:05:00
      # AWS SES configuration
      - Aws__Region=${AWS_REGION:-us-east-1}
      - Aws__AccessKeyId=${AWS_ACCESS_KEY_ID}
      - Aws__SecretAccessKey=${AWS_SECRET_ACCESS_KEY}
      # Cloudflare (optional)
      - Cloudflare__ApiToken=${CLOUDFLARE_API_TOKEN:-}
      - Cloudflare__ZoneId=${CLOUDFLARE_ZONE_ID:-}
      # CORS
      - Cors__Origins__0=https://${SELFMX_DOMAIN}
    volumes:
      # Admin session keys (App__DataProtectionKeysPath in the image)
      - selfmx_keys:/var/lib/selfmx/keys
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:17400/health"]
      interval: 30s
      timeout: 10s
      start_period: 15s
      retries: 3
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 512M
        reservations:
          cpus: '0.5'
          memory: 256M

networks:
  selfmx-net:
    driver: bridge

volumes:
  caddy_data:
  caddy_config:
  postgres_data:
  selfmx_keys:
