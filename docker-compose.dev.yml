# Development databases for local SelfMX development
# PostgreSQL (default):  docker compose -f docker-compose.dev.yml up -d
# SQL Server (optional): docker compose -f docker-compose.dev.yml --profile sqlserver up -d sqlserver

services:
  postgres:
    image: postgres:17
    container_name: selfmx-postgres-dev
    environment:
      - POSTGRES_USER=selfmx
      - POSTGRES_PASSWORD=Dev@Password123!
      - POSTGRES_DB=selfmx_dev
    ports:
      - "17403:5432"
    volumes:
      - postgres-dev-data:/var/lib/postgresql/data
    healthcheck:
      test: pg_isready -U selfmx -d selfmx_dev
      interval: 10s
      timeout: 5s
      retries: 10

  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: selfmx-sqlserver-dev
    profiles: ["sqlserver"]
    environment:
      - ACCEPT_EULA=Y
      - MSSQL_SA_PASSWORD=Dev@Password123!
      - MSSQL_PID=Developer
      - MSSQL_MEMORY_LIMIT_MB=2048
    ports:
      - "17402:1433"
    volumes:
      - sqlserver-dev-data:/var/opt/mssql
    healthcheck:
      test: /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "Dev@Password123!" -Q "SELECT 1" -C -N -b
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

volumes:
  postgres-dev-data:
  sqlserver-dev-data:
